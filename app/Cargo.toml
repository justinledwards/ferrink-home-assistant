[package]
name = "ferrink-home-assistant"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

[build-dependencies]
slint-build = "1.17.1"

[target.'cfg(all(target_arch = "arm", target_os = "linux", target_env = "musl"))'.dependencies]
slint = { version = "1.17.1", default-features = false, features = ["compat-1-2", "std", "renderer-software"] }
slint-backend-kindle = { path = "../crates/slint-backend-kindle" }

[target.'cfg(not(all(target_arch = "arm", target_os = "linux", target_env = "musl")))'.dependencies]
slint = "1.17.1"
